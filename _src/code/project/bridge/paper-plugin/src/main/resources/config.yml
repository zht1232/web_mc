# WebCraftBridge configuration.
# The bridge is a loopback-only WebSocket sidecar for browser clients. It never
# modifies server.properties and does not implement the Java client protocol.

# Bind address. Keep 127.0.0.1 unless you deliberately expose the bridge.
bind-address: 127.0.0.1
port: 8765
path: /ws

# Optional shared secret. When non-empty, clients must connect to
#   ws://127.0.0.1:8765/ws?token=<token>
# and put the same value in the hello message. Use a long random value if the
# bridge is ever bound to a non-loopback interface.
token: ""

# Browser origins allowed to open the WebSocket. The Vite dev server in this
# project listens on http://localhost:5174 (see package.json). Add your LAN IP
# if you open the page from another machine. Use "*" only for local testing.
allowed-origins:
  - "http://localhost:5174"
  - "http://127.0.0.1:5174"
  - "http://localhost:5173"
  - "http://127.0.0.1:5173"

# Non-browser clients (the Node test client) send no Origin header. Keep true
# for demos; set false to require a browser Origin.
allow-missing-origin: true

max-clients: 16

# Bukkit world name that browser clients join.
world: "world"

# Chunk radius streamed on join and while walking (0 = current chunk only).
view-distance: 2

# Server-authoritative limits.
max-reach: 6.0
max-speed: 12.0
max-join-distance: 256
